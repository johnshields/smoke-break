name: fujimoto API CI

on:
  push:
    branches: [main]
    paths:
      - "fujimoto_api/**"
  pull_request:
    branches: [main]
    paths:
      - "fujimoto_api/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: fujimoto_api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for syntax errors
        run: python -m py_compile entry.py

      - name: Check controller syntax
        run: python -m py_compile controllers/saves_controller.py

      - name: Check route syntax
        run: |
          python -m py_compile routes/routes.py
          python -m py_compile routes/saves.py

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: fujimoto_api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Deploy to Cloudflare Workers
        run: uvx --from workers-py pywrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy]

    steps:
      - name: Test health endpoint
        run: |
          set -e
          WORKER_URL="${{ secrets.FUJIMOTO_WORKER_URL }}"

          echo "Testing GET / (Health check)..."
          curl -fsS "$WORKER_URL/" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='healthy', f'Unexpected: {d}'; print('Health check passed')"

          echo "Testing GET /api (API info)..."
          curl -fsS "$WORKER_URL/api" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='OK', f'Unexpected: {d}'; print('API info passed')"

          echo "All smoke tests passed"
