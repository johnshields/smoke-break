name: fujimoto API CI

on:
  push:
    branches: [main]
    paths:
      - "fujimoto_api/**"
  pull_request:
    branches: [main]
    paths:
      - "fujimoto_api/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: fujimoto_api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check for syntax errors
        run: find . -name "*.py" -not -path "./.venv/*" -not -path "./__pycache__/*" | xargs python -m py_compile

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Test endpoints
        run: |
          set -e
          WORKER_URL="${{ secrets.FUJIMOTO_WORKER_URL }}"

          echo "Testing GET /api (API info)..."
          curl -fsS "$WORKER_URL/api" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='OK', f'Unexpected: {d}'; print('API info passed')"

          echo "Testing GET /api/healthz..."
          curl -fsS "$WORKER_URL/api/healthz" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='healthy', f'Unexpected: {d}'; print('Health check passed')"

          echo "Testing GET /api/readyz..."
          curl -fsS -H "Authorization: Bearer ${{ secrets.FUJIMOTO_API_KEY }}" "$WORKER_URL/api/readyz" | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['status'] in ('ready','degraded'), f'Unexpected: {d}'; print('Readiness check passed')"

          echo "All smoke tests passed"
